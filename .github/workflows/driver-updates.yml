# Daily check for new releases of the Vulkan drivers the app bundles (devtools/drivers/bundled.json). Each new
# release opens one issue assigned to the repo owner, so GitHub notifies them; the issue stays as the to-do for a
# compat run before the bundled copy is replaced. Run it by hand from the Actions tab with "Run workflow".
name: Driver updates

on:
  schedule:
    - cron: "17 13 * * *" # daily, 13:17 UTC (morning in Central time)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit (code audit 3, p7 L7)
      - name: Check driver releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 devtools/check-drivers.py --issues || [ $? -eq 1 ] # 1 = new releases found (issues opened)
