name = "joey64-rooms"
main = "src/index.js"
compatibility_date = "2026-08-01"

# The Joey64 Cloudflare account (JoeysRetroHandhelds), so a deploy can never land in another account wrangler is logged in to.
# Log in with XDG_CONFIG_HOME=C:\Users\Joey\.joey64-cloudflare (see ../reports/README.md).
account_id = "f59e0cc0aa0d2f4f5c99f0659d1fb57e"

# Devices reach it at https://joey64-rooms.joeysretrohandhelds.workers.dev (netplay/RoomList.kt SERVER).
workers_dev = true
preview_urls = false

# The rooms database. Not created yet: `wrangler d1 create joey64-rooms` (needs Joey's go), then put its id here.
[[d1_databases]]
binding = "DB"
database_name = "joey64-rooms"
database_id = "00000000-0000-0000-0000-000000000000"

# Per IP address, counted only: a listed room posts every 30 s, the Netplay page reads every 10 s.
[[ratelimits]]
name = "POSTS"
namespace_id = "6411"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "READS"
namespace_id = "6412"
simple = { limit = 20, period = 60 }
